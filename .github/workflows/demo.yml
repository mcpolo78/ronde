name: Démo en ligne

# Les données de démo sont relatives à « aujourd'hui » : on les régénère chaque nuit.
# L'API (Cloud Run) descend à 0 instance au repos : la première requête la relance en quelques secondes.
on:
  schedule:
    - cron: "0 2 * * *" # chaque nuit (≈ 3-4 h à Paris)
  workflow_dispatch:
    inputs:
      reseed:
        description: "Appliquer les migrations et régénérer les données de démo"
        type: boolean
        default: true

concurrency:
  group: demo-${{ github.event.schedule || 'manual' }}

jobs:
  reseed:
    if: vars.DEMO_API_URL != '' && (github.event.schedule == '0 2 * * *' || (github.event_name == 'workflow_dispatch' && inputs.reseed))
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
      RONDE_DEMO_SEED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@ronde/api..."
      - run: pnpm --filter @ronde/api codegen
      - run: pnpm db:deploy
      - run: pnpm db:seed

