packages:
  - apps/*
  - packages/*

allowBuilds:
  sharp: true
  unrs-resolver: true
  prisma: true
  "@prisma/engines": true
  esbuild: true
  # binaires PostgreSQL de la base locale (apps/api/scripts/db-dev.ts)
  "@embedded-postgres/windows-x64": true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/darwin-arm64": true
  "@embedded-postgres/darwin-x64": true

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.8"
  - "@turbo/darwin-arm64@2.11.8"
  - "@turbo/linux-64@2.11.8"
  - "@turbo/linux-arm64@2.11.8"
  - "@turbo/windows-64@2.11.8"
  - "@turbo/windows-arm64@2.11.8"
  - graphql-yoga@5.24.5
  - turbo@2.11.8
  - lucide-react@1.57.0

# Une seule version de React dans tout le monorepo, celle du SDK Expo : sinon pnpm crée des
# copies distinctes de react-native/expo selon le contexte, fatales dans un build natif.
overrides:
  react: "19.2.3"
  react-dom: "19.2.3"
  "@types/react": "~19.2.18"
  "@types/react-dom": "~19.2.3"
