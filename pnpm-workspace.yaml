packages:
  - apps/*
  - packages/*

allowBuilds:
  sharp: true
  unrs-resolver: true
  prisma: true
  "@prisma/engines": true
  esbuild: true

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.8"
  - "@turbo/darwin-arm64@2.11.8"
  - "@turbo/linux-64@2.11.8"
  - "@turbo/linux-arm64@2.11.8"
  - "@turbo/windows-64@2.11.8"
  - "@turbo/windows-arm64@2.11.8"
  - graphql-yoga@5.24.5
  - turbo@2.11.8
